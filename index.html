<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Próximamente</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
            --muted: #94a3b8;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 550px;
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 24px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
            letter-spacing: -0.025em;
        }
        p {
            color: var(--muted);
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .links a {
            color: var(--text);
            text-decoration: none;
            margin: 0 12px;
            font-weight: 500;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 4px;
            transition: color 0.2s;
        }
        .links a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">En construcción</span>
        <h1>Algo nuevo se está cocinando</h1>
        <p>Estoy trabajando en mi nuevo portfolio para mostrar mis últimos proyectos. Estará disponible muy pronto.</p>
        <div class="links">
            <!-- Sustituye los "#" por tus enlaces reales -->
            <a href="#" target="_blank">LinkedIn</a>
            <a href="#" target="_blank">GitHub</a>
            <a href="mailto:tuemail@ejemplo.com">Contacto</a>
        </div>
    </div>
</body>
</html>
