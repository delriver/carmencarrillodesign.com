<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carmen Carrillo - UX/UI Designer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="preload" href="src/fonts/Safira_March.woff2" as="font" type="font/woff2" crossorigin>
  
  <!-- Custom Styling & Theme Colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#1d0e08',          // Marrón principal de fondo
              rose: '#D8A5A5',        // Rosa principal
              sage: '#C2C6B9',        // Verde grisáceo principal
              rose_light: '#EBDBDB'   // Rosa blanquecino para texto
            }
          },
          fontFamily: {
            heading: ['"Safira March"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'spin-slow': 'spin 18s linear infinite',
            'pulse-subtle': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <style>
    @font-face {
      font-family: 'Safira March';
      src: url('./fonts/Safira_March.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    .star-glow {
      filter: drop-shadow(0px 0px 25px rgba(216, 165, 165, 0.35));
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-rose font-sans min-h-screen flex flex-col justify-between items-center p-6 md:p-10 select-none overflow-x-hidden">

  <!-- Header / Branding Personal superior -->
  <header class="w-full max-w-4xl flex flex-col items-center justify-center pt-4 md:pt-6 text-center space-y-3 z-10">
    <h1 class="font-heading text-4xl sm:text-5xl md:text-6xl tracking-wide text-brand-rose">
      Carmen Carrillo
    </h1>
    
    <div class="text-brand-rose_light text-xs sm:text-sm tracking-widest font-light pt-1">
      UX/UI DESIGNER &nbsp;|&nbsp; WEB & APP DESIGN
    </div>
  </header>


  <!-- Sección Central: Estrella giratoria + Mensaje principal -->
  <main class="w-full max-w-2xl flex flex-col items-center text-center mt-auto pt-12 pb-20 px-4 z-10">
    
    <!-- Estrella animada que simula rueda de carga / engranaje -->
    <div class="relative mb-8 md:mb-10 cursor-default" aria-hidden="true">
      <div class="absolute inset-0 bg-brand-rose/20 rounded-full blur-2xl transform scale-125 pointer-events-none"></div>
      
      <!-- SVG de la estrella girando de forma continua -->
      <img class="block w-28 h-28 sm:w-36 sm:h-36 md:w-40 md:h-40 animate-spin-slow star-glow"
           src="src/images/Rounded_light_star.svg"
           alt=""
           aria-hidden="true">
    </div>

    <!-- Título con la tipografía llamativa y color rosa -->
    <h2 class="font-heading text-3xl sm:text-4xl md:text-5xl text-brand-rose font-normal leading-tight mt-5 mb-4">
      Algo nuevo se está diseñando
    </h2>

    <!-- Descripción aclaratoria con neutro suave derivado del marrón/rosa -->
    <p class="text-brand-rose_light text-base sm:text-lg max-w-lg leading-relaxed font-light">
      Estoy trabajando en mi portfolio para mostrar mis últimos proyectos. Estará disponible muy pronto.
    </p>

  </main>


  <!-- Botones de Acción e Interacción en la parte inferior -->
  <footer class="w-full max-w-xl flex flex-col items-center space-y-4 mb-auto pb-6 z-10">
    
    <div class="flex flex-wrap justify-center gap-4 sm:gap-6 items-center w-full">
      
      <!-- Botón principal a LinkedIn -->
      <a href="https://www.linkedin.com/in/carmencarrillodesign" target="_blank" rel="noopener noreferrer" 
         class="flex items-center justify-center gap-2 px-7 py-3 rounded-full bg-brand-sage text-brand-bg font-semibold text-sm sm:text-base transition-all duration-300 hover:shadow-[0_0_20px_rgba(194,198,185,0.4)] hover:-translate-y-0.5 active:translate-y-0">
        <!-- Ícono LinkedIn -->
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
        </svg>
        <span>LinkedIn</span>
      </a>

      <!-- Botón de Contacto (Abre selector/modal rápido con email) -->
      <button id="contactBtn" onclick="toggleContact()" 
              class="flex items-center justify-center gap-2 px-7 py-3 rounded-full border border-brand-sage/60 text-brand-sage font-medium text-sm sm:text-base transition-all duration-300 hover:bg-brand-sage/10 hover:border-brand-sage hover:-translate-y-0.5 active:translate-y-0">
        <!-- Ícono Email -->
        <svg class="w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        <span>Contacto</span>
      </button>

    </div>

    <!-- Menú desplegable suave de contacto al pulsar el botón -->
    <div id="contactPanel" class="hidden opacity-0 transform -translate-y-2 transition-all duration-300 ease-out mt-3 p-4 rounded-2xl bg-brand-bg border border-brand-rose/20 text-center shadow-2xl shadow-brand-bg/25 max-w-sm w-full">
      <p class="text-xs text-brand-rose mb-2 uppercase tracking-wider font-medium">Correo electrónico</p>
      <div class="flex items-center justify-between gap-2 bg-brand-bg/60 p-2.5 rounded-xl border border-brand-rose/10">
        <span class="text-sm text-brand-rose font-mono select-all truncate">ccpa65@gmail.com</span>
        <button onclick="copyEmail()" id="copyBtn" class="px-3 py-1 rounded-lg bg-brand-sage/20 text-brand-sage text-xs font-medium hover:bg-brand-sage hover:text-brand-bg transition-colors flex-shrink-0">
          Copiar
        </button>
      </div>
      <a href="mailto:ccpa65@gmail.com" class="inline-block mt-3 text-xs text-brand-rose hover:underline">
        Abrir aplicación de correo &rarr;
      </a>
    </div>

    <!-- Copyright discreto -->
    <p class="text-xs text-brand-rose/50 pt-4 font-light">
      <!--&copy; Carmen Carrillo — Todos los derechos reservados.-->
    </p>
  </footer>


  <!-- Lógica simple en JavaScript para desplegar el panel de contacto y copiar email -->
  <script>
    function toggleContact() {
      const panel = document.getElementById('contactPanel');
      if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        setTimeout(() => {
          panel.classList.remove('opacity-0', '-translate-y-2');
        }, 10);
      } else {
        panel.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => {
          panel.classList.add('hidden');
        }, 300);
      }
    }

    function copyEmail() {
      const email = "ccpa65@gmail.com";
      
      // Método seguro de copia
      const tempInput = document.createElement("input");
      tempInput.value = email;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand("copy");
      document.body.removeChild(tempInput);

      // Feedback visual en el botón
      const btn = document.getElementById('copyBtn');
      const originalText = btn.innerText;
      btn.innerText = "¡Copiado!";
      btn.classList.add("bg-brand-sage", "text-brand-bg");
      
      setTimeout(() => {
        btn.innerText = originalText;
        btn.classList.remove("bg-brand-sage", "text-brand-bg");
      }, 2000);
    }
  </script>

</body>
</html>
